# conda env create -f environment.yml  →  conda activate venv
# torch 는 CUDA 13.0 휠을 따로 받는다(아래 pip 의 --extra-index-url). 다른 GPU 는 그에 맞는 torch 2.14.0 휠.
name: venv
channels:
  - conda-forge
dependencies:
  - python=3.11.16
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu130
      - torch==2.14.0
      - torchvision==0.29.0
      - ultralytics==8.4.157
      - ultralytics-thop==2.1.6
      - diffusers==0.40.0
      - transformers==5.17.0
      - accelerate==1.15.0
      - safetensors==0.8.0
      - huggingface_hub==1.32.0
      - opencv-python-headless==5.0.0.93
      - numpy==2.4.6
      - scipy==1.17.1
      - pandas==3.0.6
      - polars==1.44.2
      - matplotlib==3.11.2
      - pillow==12.3.0
      - PyYAML==6.0.3
      - tabulate==0.10.0
      - tqdm==4.70.1
      - mistune==3.1.4
